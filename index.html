<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Zinan: Quality You Can Trust. Handbags, gadgets and home essentials in Bangladesh."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@800&family=Playfair+Display:wght@500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/home.css"><title>Zinan · Quality You Can Trust</title></head>
<body data-page="home2">
<div id="site-header"></div>
<main>
  <!-- ===== SECTION: HERO · START ===== -->
  <section class="hero2">
    <div class="hero2-img"><img src="img/hero.webp" width="1000" height="1000" fetchpriority="high" alt="A warm lamp glowing on a wooden bedside table"></div>
    <div class="hero2-text wrap">
      <p class="eyebrow" data-cfg="HERO_EYEBROW"></p>
      <h1 data-cfg="HERO_TITLE"></h1>
      <p class="hero-sub" data-cfg="HERO_SUB"></p>
      <a class="btn" href="shop.html" data-cfg="HERO_CTA"></a>
    </div>
  </section>
  <!-- ===== SECTION: HERO · END ===== -->

  <!-- ===== SECTION: TRUST CARD · START ===== -->
  <div class="wrap"><div class="trustcard" id="trustcard"></div></div>
  <!-- ===== SECTION: TRUST CARD · END ===== -->

  <!-- ===== SECTION: OFFER (hidden until enabled in config.js) · START ===== -->
  <section class="offer" id="offer" hidden></section>
  <!-- ===== SECTION: OFFER · END ===== -->

  <!-- ===== SECTION: CATEGORIES · START ===== -->
  <section class="block"><div class="wrap">
    <div class="sec-head"><h2>Shop by category</h2><a class="more" href="shop.html">View all</a></div>
    <div class="tiles" id="tiles"></div>
  </div></section>
  <!-- ===== SECTION: CATEGORIES · END ===== -->

  <!-- ===== SECTION: FEATURED · START ===== -->
  <section class="block"><div class="wrap">
    <div class="sec-head"><h2>Featured</h2><a class="more" href="shop.html">View all</a></div>
    <div class="grid" id="featured"><p class="notice">Loading…</p></div>
  </div></section>
  <!-- ===== SECTION: FEATURED · END ===== -->

  <!-- ===== SECTION: SPOTLIGHT · START ===== -->
  <section id="spotlight" hidden></section>
  <!-- ===== SECTION: SPOTLIGHT · END ===== -->

  <!-- In index.html, replace the old WHY ZINAN section (START line to END line) with this -->
<!-- ===== SECTION: EXPERIENCE · START ===== -->
<section class="experience"><div class="wrap exp">
  <p class="eyebrow" id="exp-eyebrow"></p>
  <h2 id="exp-title"></h2>
  <p class="exp-intro" id="exp-intro"></p>
  <ol class="exp-list" id="exp-list"></ol>
</div></section>
<!-- ===== SECTION: EXPERIENCE · END ===== -->

<!-- In index.html, add this right AFTER the FOLLOW section's END line and BEFORE </main> -->
<!-- ===== SECTION: REVIEWS · START ===== -->
<section class="reviews" id="reviews" ></section>
<!-- ===== SECTION: REVIEWS · END ===== -->

  <!-- In index.html, replace the old FOLLOW section (START line to END line) with this -->
<!-- ===== SECTION: FOLLOW · START ===== -->
<section class="follow band-sand"><div class="wrap">
  <h2 data-cfg="FOLLOW_TITLE"></h2>
  <div class="socials" id="socials"></div>
</div></section>
<!-- ===== SECTION: FOLLOW · END ===== -->

</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages.js"></script>
<script src="js/home.js"></script>
</body></html>
